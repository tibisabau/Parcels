name: CI Additional
on:
  workflow_dispatch: # allows you to trigger manually
  schedule:
    - cron: "0 0 1 */3 *" # Run every 3 months

jobs:
  min-version-policy:
    name: Minimum Version Policy
    runs-on: "ubuntu-latest"
    env:
      COLUMNS: 120
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
      - run: |
          uvx --from xarray-minimum-dependency-policy==2.0.0 \
          minimum-versions validate \
          --policy=.github/ci/policy.yaml \
          --manifest-path=./pixi.toml \
          pixi:test-minimum

  linkcheck:
    name: pixi run docs-linkcheck
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.9.0
      - run: pixi run docs-linkcheck

  create-issue-on-failure:
    name: Create issue on failure
    runs-on: ubuntu-latest
    needs:
      - min-version-policy
      - linkcheck
    # Always evaluate/run this job after dependencies finish (even if they failed)
    if: ${{ always() }}
    permissions:
      issues: write
    steps:
      - name: Create issue if any job failed
        if: ${{ needs.min-version-policy.result == 'failure' || needs.linkcheck.result == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().split('T')[0];

            const results = {
              'Minimum Version Policy': '${{ needs.min-version-policy.result }}',
              'Docs link check': '${{ needs.linkcheck.result }}',
            };

            const failedJobs = Object.entries(results)
              .filter(([, r]) => r === 'failure')
              .map(([name]) => name);

            const title = `CI Additional workflow failed - ${date}`;
            const body = [
              `The CI Additional workflow failed.`,
              ``,
              `Workflow run: ${workflowUrl}`,
              `Trigger: ${context.eventName}`,
              `Branch: ${context.ref}`,
              ``,
              `Failed jobs: ${failedJobs.join(', ')}`,
              ``,
              `Please investigate the failure and fix the issues.`,
              ``,
              `_This issue was automatically created by the workflow._`
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'automated'],
            })
